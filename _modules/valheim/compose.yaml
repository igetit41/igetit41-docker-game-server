services:
  game-server:
    image: ghcr.io/lloesche/valheim-server
    container_name: game-server
    restart: unless-stopped
    stop_grace_period: 2m
    cap_add:
      - sys_nice
    env_file:
      - ./valheim.env
    ports:
      - "2456-2458:2456-2458/udp"
      # Status JSON for idle checks — localhost only (not in GCP firewall)
      - "127.0.0.1:80:80/tcp"
    volumes:
      - ./config:/config
      - ./data:/opt/valheim
